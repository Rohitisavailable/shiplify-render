{% extends "couriermanage/base.html" %}
{% block content %}
<section class="page-shell content-narrow">
  <div class="surface form-area">
    <span class="eyebrow">Account access</span>
    <h1>Reset your password</h1>
    <p class="page-intro">Enter your email address and we will send instructions to create a new password.</p>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions"><button class="button" type="submit">Send reset link</button></div>
    </form>
  </div>
</section>
{% endblock content %}
