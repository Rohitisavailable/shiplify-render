{% extends "couriermanage/base.html" %}
{% block content %}
<section class="page-shell content-narrow">
  <div class="surface form-area">
    <span class="eyebrow">Account access</span>
    <h1>Choose a new password</h1>
    <p class="page-intro">Use a strong password you have not used elsewhere.</p>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions"><button class="button" type="submit">Update password</button></div>
    </form>
  </div>
</section>
{% endblock content %}
